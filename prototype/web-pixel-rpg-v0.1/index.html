<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adventurer Life Web Pixel RPG v0.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111923;color:#eef;font-family:system-ui}body{display:grid;place-items:center;min-height:100vh}
.wrap{width:min(100vw,1100px)}.top{display:flex;justify-content:space-between;padding:10px}.game{position:relative;aspect-ratio:16/9;background:#111;border:1px solid #334;border-radius:12px;overflow:hidden}
canvas{width:100%;height:100%;image-rendering:pixelated}.hud{position:absolute;right:10px;top:10px;background:#0c151ee8;padding:10px;border-radius:9px;font-size:12px;line-height:1.6}
.msg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(700px,90%);background:#091019f2;border:1px solid #445;padding:12px;border-radius:10px;display:none}
.inv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#091019f2;border:1px solid #445;padding:15px;border-radius:10px;display:none}
kbd{background:#253342;padding:2px 5px;border-radius:4px}button{background:#263645;color:#fff;border:1px solid #567;padding:6px 10px;border-radius:7px}
</style></head><body><div class="wrap">
<div class="top"><b>Adventurer Life — Web Pixel RPG v0.1</b><span>เปิดไฟล์นี้แล้วเล่นได้ทันที</span></div>
<div class="game"><canvas id="c" width="960" height="540"></canvas>
<div class="hud"><b id="map">หมู่บ้านเริ่มต้น</b><br><span id="stat"></span><br><span id="quest"></span><br><br>
<kbd>WASD</kbd> เดิน <kbd>E</kbd> คุย <kbd>Z</kbd> ตี <kbd>I</kbd> กระเป๋า <kbd>1</kbd> ยา</div>
<div class="msg" id="msg"></div><div class="inv" id="inv"></div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),K=new Set(),S='al-web-rpg-v01';
let p={x:480,y:300,hp:30,max:30,lv:1,exp:0,next:30,gold:20,map:'v',pot:2,gel:0,q:0,kills:0,cd:0,hit:0}, mobs=[];
try{Object.assign(p,JSON.parse(localStorage.getItem(S)||'{}'))}catch{}
const maps={
v:{name:'หมู่บ้านเริ่มต้น',base:'#82b967',road:'#c7a974',obs:[['h',60,60,210,125],['h',690,70,200,120],['t',330,45,30,115],['t',610,55,30,115],['w',65,355,180,105]],npcs:[['elder','ผู้ใหญ่บ้าน',465,220],['shop','พ่อค้า',370,320],['guide','รุ่นพี่นักผจญภัย',570,330]],portal:[430,505,100,35,'f',480,50]},
f:{name:'ทุ่งหญ้าสไลม์',base:'#6dab58',road:'#b99a68',obs:[['r',90,85,40,40],['r',220,390,40,40],['r',740,120,40,40],['t',310,120,30,120],['t',640,305,30,120]],npcs:[],portal:[430,0,100,32,'v',480,475]}
};
function save(){localStorage.setItem(S,JSON.stringify(p))}function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawn(){mobs=[[170,170],[300,260],[480,190],[610,220],[760,260],[370,410],[590,420],[820,460]].map((q,i)=>({x:q[0],y:q[1],hx:q[0],hy:q[1],hp:3,dead:0,resp:0,t:i*.2}))}
if(p.map==='f')spawn();
function message(t){let m=document.getElementById('msg');m.innerHTML=t+'<div style="margin-top:8px"><button onclick="closeMsg()">ปิด</button></div>';m.style.display='block'}function closeMsg(){document.getElementById('msg').style.display='none'}
function collide(o,X,Y){let [_,ox,oy,w,h]=o,nx=Math.max(ox,Math.min(X,ox+w)),ny=Math.max(oy,Math.min(Y,oy+h));return (X-nx)**2+(Y-ny)**2<14**2}
function move(dx,dy,dt){let m=maps[p.map],nx=Math.max(14,Math.min(946,p.x+dx*160*dt)),ny=Math.max(14,Math.min(526,p.y+dy*160*dt));if(!m.obs.some(o=>collide(o,nx,p.y)))p.x=nx;if(!m.obs.some(o=>collide(o,p.x,ny)))p.y=ny}
function talk(){let ns=maps[p.map].npcs.map(n=>({n,d:Math.hypot(p.x-n[2],p.y-n[3])})).sort((a,b)=>a.d-b.d);if(!ns[0]||ns[0].d>70)return message('ไม่มี NPC อยู่ใกล้ ๆ');let n=ns[0].n;
if(n[0]==='elder'){if(p.q===0){p.q=1;p.kills=0;message('ผู้ใหญ่บ้าน: ช่วยกำจัดสไลม์ 3 ตัวทางใต้ของหมู่บ้านให้หน่อย');save()}else if(p.q===1)message('ผู้ใหญ่บ้าน: ตอนนี้ '+p.kills+'/3 ตัว');else if(p.q===2){p.q=3;p.gold+=50;gain(20);message('เควสสำเร็จ! +50 Gold +20 EXP');save()}else message('ผู้ใหญ่บ้าน: ขอบใจมาก นักผจญภัย')}
else if(n[0]==='shop'){if(p.gold>=10){p.gold-=10;p.pot++;message('พ่อค้า: ซื้อ Potion 1 ขวด ราคา 10 Gold');save()}else message('พ่อค้า: Gold ไม่พอ')}
else message('รุ่นพี่: ลงประตูด้านล่างเพื่อไปทุ่งสไลม์ ใช้ Z โจมตี');
}
function gain(v){p.exp+=v;while(p.exp>=p.next){p.exp-=p.next;p.lv++;p.next=Math.floor(p.next*1.45);p.max+=5;p.hp=p.max;message('LEVEL UP! Lv.'+p.lv)}}
function attack(){if(p.cd>0)return;p.cd=.35;if(p.map!=='f')return;let m=mobs.find(m=>!m.dead&&D(p,m)<55);if(!m)return;m.hp--;if(m.hp<=0){m.dead=1;m.resp=5;p.gel++;p.gold+=2;gain(8);if(p.q===1){p.kills++;if(p.kills>=3){p.q=2;message('ครบ 3 ตัวแล้ว! กลับไปหาผู้ใหญ่บ้าน')}}save()}}
function potion(){if(!p.pot)return message('Potion หมด');if(p.hp>=p.max)return message('HP เต็มแล้ว');p.pot--;p.hp=Math.min(p.max,p.hp+18);save()}
function inventory(){let v=document.getElementById('inv');v.innerHTML='<b>กระเป๋า</b><p>🧪 Potion x'+p.pot+'</p><p>🟢 Slime Gel x'+p.gel+'</p><p>🪙 Gold '+p.gold+'</p><button onclick="inventory()">ปิด</button>';v.style.display=v.style.display==='block'?'none':'block'}
function upd(dt){if(p.cd>0)p.cd-=dt;if(p.hit>0)p.hit-=dt;let dx=(K.has('KeyD')||K.has('ArrowRight'))-(K.has('KeyA')||K.has('ArrowLeft')),dy=(K.has('KeyS')||K.has('ArrowDown'))-(K.has('KeyW')||K.has('ArrowUp'));if(dx||dy){let l=Math.hypot(dx,dy);move(dx/l,dy/l,dt)}
let z=maps[p.map].portal;if(p.x>z[0]&&p.x<z[0]+z[2]&&p.y>z[1]&&p.y<z[1]+z[3]){p.map=z[4];p.x=z[5];p.y=z[6];if(p.map==='f')spawn();else mobs=[];save()}
if(p.map==='f')for(let m of mobs){if(m.dead){m.resp-=dt;if(m.resp<=0){m.dead=0;m.hp=3;m.x=m.hx;m.y=m.hy}continue}let d=D(p,m),a=Math.atan2(p.y-m.y,p.x-m.x);if(d<150){m.x+=Math.cos(a)*50*dt;m.y+=Math.sin(a)*50*dt}if(d<28&&p.hit<=0){p.hp-=3;p.hit=.7;if(p.hp<=0){p.hp=p.max;p.map='v';p.x=480;p.y=300;mobs=[];message('หมดสติ... กลับหมู่บ้าน')}}}
document.getElementById('map').textContent=maps[p.map].name;document.getElementById('stat').textContent='Lv.'+p.lv+' HP '+p.hp+'/'+p.max+' EXP '+p.exp+'/'+p.next+' Gold '+p.gold;document.getElementById('quest').textContent=p.q===0?'เควส: คุยกับผู้ใหญ่บ้าน':p.q===1?'เควส: สไลม์ '+p.kills+'/3':p.q===2?'เควส: กลับหาผู้ใหญ่บ้าน':'เควสเริ่มต้น ✓'}
function draw(){let m=maps[p.map];x.fillStyle=m.base;x.fillRect(0,0,960,540);x.fillStyle=m.road;x.fillRect(430,0,100,540);x.fillRect(0,245,960,70);
for(let o of m.obs){let [t,a,b,w,h]=o;if(t==='h'){x.fillStyle='#a96d45';x.fillRect(a,b+25,w,h-25);x.fillStyle='#6b3d32';x.beginPath();x.moveTo(a-8,b+27);x.lineTo(a+w/2,b-20);x.lineTo(a+w+8,b+27);x.fill()}else if(t==='t'){x.fillStyle='#6c4a2e';x.fillRect(a+9,b+45,12,h-45);x.fillStyle='#3f7a48';x.beginPath();x.arc(a+15,b+38,34,0,7);x.fill()}else{x.fillStyle=t==='w'?'#65abc8':'#687a7b';x.fillRect(a,b,w,h)}}
for(let n of m.npcs){x.fillStyle='#f2c9a5';x.fillRect(n[2]-9,n[3]-20,18,18);x.fillStyle='#d79557';x.fillRect(n[2]-10,n[3],20,22);x.fillStyle='#fff';x.font='12px sans-serif';x.textAlign='center';x.fillText(n[1],n[2],n[3]-27)}
for(let q of mobs)if(!q.dead){x.fillStyle='#4fc270';x.beginPath();x.arc(q.x,q.y,16,0,7);x.fill();x.fillStyle='#17251c';x.fillRect(q.x-7,q.y-4,3,4);x.fillRect(q.x+4,q.y-4,3,4);x.fillStyle='#b43e3e';x.fillRect(q.x-15,q.y-27,30*q.hp/3,4)}
x.fillStyle=p.hit&&Math.floor(p.hit*12)%2?'#fff':'#365c92';x.fillRect(p.x-11,p.y-3,22,24);x.fillStyle='#f0c49b';x.fillRect(p.x-10,p.y-22,20,18);x.fillStyle='#5b3625';x.fillRect(p.x-11,p.y-25,22,7)}
let last=performance.now();function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loop)}
onkeydown=e=>{K.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='KeyE'||e.code==='Enter')talk();if(e.code==='KeyZ'||e.code==='Space')attack();if(e.code==='KeyI')inventory();if(e.code==='Digit1')potion()};onkeyup=e=>K.delete(e.code);setInterval(save,15000);requestAnimationFrame(loop);
</script></body></html>
