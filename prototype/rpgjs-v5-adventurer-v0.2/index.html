<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>Willowbrook Chronicle · v0.2</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/reset.css"><link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/index.css"><link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-default/theme.css"><link rel="stylesheet" href="./src/game/ui.css"></head>
<body><div class="game-frame"><div id="rpg"></div><div id="world-feedback" aria-hidden="true"></div>
<main id="game-hud" class="rpg-ui" data-rpg-theme="parchment" aria-label="เกม Willowbrook">
<section class="hud-panel rpg-ui-panel top"><div class="eyebrow">✦ WILLOWBROOK CHRONICLE</div><div class="hero-card"><div class="portrait"></div><div class="hero-info"><b>นักผจญภัย</b><p id="player-stats">กำลังเชื่อมต่อ...</p><progress id="hp-meter" value="30" max="30" aria-label="HP"></progress><progress id="exp-meter" value="0" max="30" aria-label="EXP"></progress></div></div><div id="purse"></div></section>
<section class="hud-panel rpg-ui-panel region"><div class="eyebrow">WILLOWBROOK REGION</div><b id="map-name">กำลังโหลดแผนที่</b><div class="quest-heading">✧ ACTIVE QUEST</div><div id="quest"></div></section>
<aside id="developer-panel" class="hud-panel rpg-ui-panel side" hidden><b>ข้อมูลทดสอบ</b><div id="phase"></div><div id="position"></div><div id="performance"></div><b>ผู้เล่นในแผนที่</b><ul id="players"></ul><details open><summary>สไลม์ · คลิกเพื่อตามไปฟัน</summary><div id="monsters"></div></details></aside>
<section id="inventory" class="hud-panel rpg-ui-panel" hidden><div class="eyebrow">ADVENTURER'S SATCHEL</div><b>กระเป๋าเดินทาง</b><p id="inventory-items"></p><button class="rpg-ui-button" data-action="potion">ใช้ Potion</button><button id="inventory-close" class="rpg-ui-button">ปิดกระเป๋า</button></section>
<section class="hud-panel rpg-ui-panel bottom"><div id="notice" role="status">พร้อมออกเดินทาง</div><div class="toolbar"><small>คลิก / WASD เดิน · Z ฟัน · E คุย</small><div class="actions"><button class="rpg-ui-button" data-action="attack">⚔ ฟัน (Z)</button><button class="rpg-ui-button" data-action="talk">คุย (E)</button><button class="rpg-ui-button" id="inventory-toggle">กระเป๋า (I)</button><button class="rpg-ui-button" data-action="potion">Potion (1)</button></div></div></section>
<nav class="utility"><button class="rpg-ui-button" data-action="travel">เดินไปประตู</button><button class="rpg-ui-button" data-action="save">บันทึก (K)</button><button class="rpg-ui-button" data-action="load">โหลด (L)</button><button id="developer-toggle" class="rpg-ui-button" aria-expanded="false">ข้อมูลทดสอบ</button><div class="sound-controls"><button id="sound-toggle" class="rpg-ui-button">เปิดเสียง</button><input id="sound-volume" type="range" min="0" max="100" value="35" aria-label="ความดังเสียง"></div></nav>
</main></div></body></html>
